[package]
name = "deli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "DELI, the Davlgd Exherbo Linux Installer: installs Exherbo Linux servers from its own ISO, or as a cloud image"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/davlgd/deli"
keywords = ["exherbo", "installer", "linux", "server", "iso"]
categories = ["command-line-utilities"]
# Distributed on the ISO, not on crates.io.
publish = false

[dependencies]
# No colours nor "did you mean" suggestions: a console installer needs neither.
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"

# The smallest binary: it ships on the ISO.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
